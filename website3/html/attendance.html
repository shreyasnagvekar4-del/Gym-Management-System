<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/attendance.css" />
    <link rel="stylesheet" href="../css/attendance.css" />
    <link rel="stylesheet" href="../css/attendance.css" />
    <script src="../javascript/attendance.js" defer></script>

    <title>My Attendance</title>


</head>

<body>

    <div class="menu-bar">

        <div class="menu-left">

            <div class="back-btn">
                <span id="back_arrow" onclick="back()">←</span>
            </div>

            <span id="back-txt">Back</span>

        </div>

        <div class="a_details">

            <div class="insider">
                <h1>📅 My Attendance</h1>
            </div>

        </div>

    </div>

    <div class="calendar-container">

        <div class="calendar-header">

            <button id="prevMonth">◀</button>

            <h2 id="monthYear"></h2>

            <button id="nextMonth">▶</button>

        </div>

        <div class="weekdays">

            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>

        </div>

        <div id="calendar" class="calendar"></div>

    </div>

</body>
</html>
