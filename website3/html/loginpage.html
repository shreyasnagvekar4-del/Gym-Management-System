    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <script src="../javascript/JavaScript.js" defer></script>
        <link rel="stylesheet" href="../css/loginpage.css" />
        <title></title>
    </head>
    <body>
        
        
        <div class="register" onclick="openRegister()">
            <div class="register-afterview">
                <img src="../images/weak.jpg" class="panel-image" />
                <h1>New!<br />Sign Up</h1>
                
            </div>
            <div class="register-form">
                <h1>Sign Up</h1>
                <label>
                    Name
                    <input type="text" id="Name" placeholder="Enter name" required />
                </label><br />
                <label>
                    Email
                    <input type="email" id="Email" placeholder="Enter email" required />
                </label><br />
                <label>
                    Phone no.
                    <input type="tel" id="Phone" placeholder="Enter phone number"  required />
                </label>
                <br />
                <label>
                    Password
                    <input type="password" id="Password" placeholder="Enter password" minlength="8" maxlength="12" required />
                </label>
                <br />
                <label>
                    Password
                    <input type="password" id="Confirm_Password" placeholder="Re-enter password" minlength="8" maxlength="12" required />
                </label>
                <div class="show-password">
                <input type="checkbox" id="ShowPassword" onclick="ShowPassword2()" />
                <label for="ShowPassword">Show Password</label></div>
                <br />
                <button type="button" class="login-button" onclick="RegisterUser()">Register</button>
                <h3>OR</h3>
                <button class="google-text">
                    <img src="../images/google.png" alt="Google-logo" class="google-logo" aria-hidden="true" /><span>Login with Google</span>
                </button>
            </div>
        </div>
        

        <div class="login" onclick="openLogin()">
            <div class="login-preview">
                <img src="../images/strong.jpg" class="panel-image" />
                <h1>Already have an<br />account?<br />Login</h1>
            </div>

            <div class="login-form">
                <h1>Welcome Back!</h1>
            <label>
                Email id
                <input type="email" id="LoginEmail" placeholder="Enter email" required />
            </label>
            <br />

            <label>Password
            <input type="password" id="LoginPassword" placeholder="Enter password" required /></label>
            <div class="show-password">
                <input type="checkbox" id="ShowPassword" onclick="ShowPassword1()" />
             <label for="LoginPassword">Show Password</label></div>
            
            <br />
            <button class="login-button" onclick="Login1()">login</button><br />

            <h3>OR</h3>
            <button class="google-text" >
                <img src="../images/google.png" class="google-logo" aria-hidden="true" />
                Login with Google
            </button>
            </div>
        </div>

    </body>
    </html>
