<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width , initial-scale=1.0" />

    <script src="../javascript/editMember.js" defer></script>
    <link rel="stylesheet" href="../css/editMember.css" />

    <title>Edit Member</title>
</head>

<body>

    <div class="menubar">

        <span class="back-btn" onclick="back()">←</span>

        <h2>Edit Member</h2>

    </div>

    <div class="container">

        <div class="profile-section">

            <img id="profileImage"
                 src="../images/default-profile.webp"
                 alt="Profile Picture">

        </div>

        <label>Name</label>
        <input type="text" id="name">

        <label>Email</label>
        <input type="email" id="email" readonly>

        <label>Phone</label>
        <input type="text" id="phone">

        <label>Age</label>
        <input type="number" id="age">

        <label>Gender</label>
        <select id="gender">
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Address</label>
        <textarea id="address"></textarea>

        <label>Membership Plan</label>
        <select id="membershipPlan">
            <option>Monthly</option>
            <option>Quarterly</option>
            <option>Half-Year</option>
            <option>Yearly</option>
        </select>

        <label>Status</label>
        <select id="membershipStatus">
            <option>Active</option>
            <option>Expired</option>
        </select>

        <button onclick="saveChanges()">
            Save Changes
        </button>

    </div>

</body>
</html>
