<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://unpkg.com/html5-qrcode" defer></script>
    <script src="../javascript/adminScanner.js" defer></script>

    <link rel="stylesheet" href="../css/adminScanner.css" />

    <title>Scan QR</title>
</head>

<body>

    <div class="menu-bar">

        <div class="menu-left">
            <div class="back_btn">
                <span id="back_btn" onclick="back()">←</span>
            </div>
            <span id="back_txt">Back</span>
        </div>

        <div class="ps_details">
            <div class="insider">
                <h1>Scan Member QR</h1>
            </div>
        </div>

    </div>

    <div class="container" >

        <div id="reader"></div>

        <div class="member-card">

            <h3>Member Details</h3>

            <div class="profile-container">
                <img id="memberImage" src="../images/default.png" alt="Profile Picture">
            </div>

            <p><strong>Name:</strong> <span id="memberName">-</span></p>

            <p><strong>Email:</strong> <span id="memberEmail">-</span></p>

            <p><strong>Plan:</strong> <span id="memberPlan">-</span></p>

            <p><strong>Status:</strong> <span id="memberStatus">-</span></p>

            <p><strong>Expiry:</strong> <span id="memberExpiry">-</span></p>

            

            <button id="scanAgainBtn" onclick="scanAgain()">
                Scan Again
            </button>

        </div>

    </div>

</body>
</html>
