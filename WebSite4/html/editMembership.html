<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../javascript/editMembership.js" defer></script>
    <link rel="stylesheet" href="../css/editMembership.css" />
    <title>Edit Membership</title>
</head>
<body>

    <div class="menu-bar">

        <div class="menu-left">
            <div class="back_btn">
                <span id="back_btn" onclick="back()">←</span>
            </div>

            <span id="back_txt">Back</span>
        </div>

        <div class="ps_details">
            <div class="insider">
                <h1>💳 Edit Membership</h1>
            </div>
        </div>

    </div>

    <div class="edit-card">

        <div class="input-group">

            <label>Plan Name</label>

            <input type="text"
                   id="planName" />

        </div>

        <div class="input-group">

            <label>Duration (Months)</label>

            <input type="number"
                   id="durationMonths"
                   min="1" />

        </div>

        <div class="input-group">

            <label>Price (₹)</label>

            <input type="number"
                   id="price"
                   min="0"
                   step="0.01" />

        </div>

        <div class="input-group">

            <label>Description</label>

            <textarea id="description"
                      rows="6"></textarea>

        </div>

        <button class="save-btn"
                onclick="saveChanges()">

            Save Changes

        </button>

    </div>

</body>
</html>
