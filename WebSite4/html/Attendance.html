<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Attendance</title>

    <link rel="stylesheet" href="../css/Attendance.css" />
    <script src="../javascript/Attendance.js" defer></script>
</head>
<body>

    <div class="menu-bar">

    <div class="menu-left">
        <div class="back_btn">
            <span id="back_btn" onclick="back()">←</span>
        </div>
        <span id="back_txt">Back</span>
    </div>

    <div class="ps_details">
        <div class="insider">
            <h1>Attendance</h1>
        </div>
    </div>

    </div>

    <div class="container">

        <div class="filter-section">

            <label>Select Date</label>

            <input type="date" id="attendanceDate" />

            <button id="loadAttendance">
                Show Attendance
            </button>

        </div>

        <div class="summary">

            <h3>
                Total Members Present :
                <span id="totalPresent">0</span>
            </h3>

        </div>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Check In</th>

                </tr>

            </thead>

            <tbody id="attendanceBody">
            </tbody>

        </table>

    </div>

</body>
</html>
